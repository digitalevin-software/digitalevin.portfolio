version: 2
updates:
  # npm paketleri: haftalık; küçük güncellemeler tek PR'da toplanır, büyük sürümler ayrı PR olur.
  # cooldown: yeni yayınlanan bir sürüm 7 gün beklemeden önerilmez (ele geçirilmiş paketlere karşı).
  # Güvenlik güncellemeleri cooldown'a ve haftalık takvime takılmaz, hemen açılır.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Elle yapılması gereken büyük sürüm geçişleri. Bu paketlerin küçük/yama güncellemeleri gelmeye devam eder.
    ignore:
      # typescript-eslint henüz TypeScript 7'yi desteklemiyor (peer: <6.1.0); destek gelince kaldırın
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Tailwind 4 yeni yapılandırma sistemi ve PostCSS eklentisi istiyor; ayrı bir geçiş işi
      - dependency-name: tailwindcss
        update-types: ['version-update:semver-major']

  # GitHub Actions: iş akışlarında sabitlenmiş commit SHA'larını ve sürüm yorumlarını günceller
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

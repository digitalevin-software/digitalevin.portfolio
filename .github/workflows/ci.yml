name: CI

# main'e açılan her pull request'te siteyi derler ve kontrol eder. main korumalıysa (bkz. README)
# bu kontroller geçmeden merge edilemez. Haftalık çalışma, yeni çıkan güvenlik açıklarını yakalar.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Pazartesi 06:00 UTC
  workflow_dispatch:

permissions: {}

# Aynı PR'a yeni bir push gelince eski çalışmayı iptal et
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      # Alt dizinde derlemek daha sıkı bir test: sabit "/" ile yazılmış yollar burada kırılır.
      # Alt dizinde doğru çalışan site, alan adının kökünde ("/") de çalışır.
      base-path: /digitalevin.portfolio/
      cache: true

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # package-lock.json'daki tüm paketleri (geliştirme araçları dahil) bilinen açıklara karşı tarar
      - run: npm audit --audit-level=moderate

  # Özel (private) repolarda GitHub Advanced Security gerektirir; repo özelken atlanır.
  # Bilinen açıklar her durumda yukarıdaki npm audit işiyle yakalanır.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # PR'ın eklediği/güncellediği paketlerde açık veya uygunsuz lisans varsa PR'ı durdurur
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
